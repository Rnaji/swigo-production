<div class="modal fade" id="orderModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">
                    🍽️ Commander - Table <span id="orderTableNumber"></span>
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <!-- STEP 1 -->
                <div id="step-guests">
                    <div class="text-center mb-4">
                        <p class="text-muted">Nombre de convives</p>
                        <div class="d-flex justify-content-center align-items-center gap-4">
                            <button type="button" id="minusGuest" class="btn btn-outline-secondary btn-lg">−</button>
                            <span id="guestCount" class="fs-1 fw-bold">2</span>
                            <button type="button" id="plusGuest" class="btn btn-outline-secondary btn-lg">+</button>
                        </div>
                    </div>

                    <button type="button" id="startOrder" class="btn btn-success btn-lg w-100">
                        🍽️ Prendre la commande
                    </button>
                </div>

                <!-- STEP 2 -->
                <div id="step-menu" class="d-none">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <button type="button" id="btnBackToGuests" class="btn btn-outline-secondary">← Retour</button>
                        <strong>Convive <span id="currentGuest">1</span> / <span id="totalGuests">2</span></strong>
                        <div></div>
                    </div>

                    <div id="menuChoices" class="row"></div>
                </div>

                <!-- STEP 3 -->
                <div id="step-section" class="d-none">
                    <div id="step-section-content"></div>
                </div>

                <!-- STEP 4 -->
                <div id="recap" class="d-none">
                    <h5 class="text-center mb-3">📋 Récapitulatif</h5>

                    <div id="recapContent"></div>

                    <div class="d-grid gap-2 mt-3">
                        <button type="button" id="saveOrder" class="btn btn-success btn-lg">
                            ✅ Valider la commande
                        </button>
                    </div>
                </div>

                <!-- Ticket -->
                <div id="liveTicket" class="mt-3 p-2 bg-light rounded"></div>

            </div>

        </div>
    </div>
</div>
